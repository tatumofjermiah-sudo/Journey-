<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journey — The Cycle Protocol</title>
  <style>
    /* ============================================================
       VARIABLES & RESET
    ============================================================ */
    :root {
      --bg:       #08060e;
      --bg2:      #0c0a16;
      --bg3:      #10101e;
      --border:   #1e1a2e;
      --text:     #ede8f8;
      --muted:    #8878a8;
      --dim:      #4a4068;
      --gold:     #f0b840;
      --gold-lt:  #ffd060;
      --blue:     #5bb8d4;
      --green:    #4cd98a;
      --red:      #e03030;
      --coral:    #e8702a;
      --purple:   #b89fd8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #2e2845; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3e3860; }

    /* ============================================================
       HEADER — warm LA amber/gold gradient accent
    ============================================================ */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 28px;
      background: rgba(8,6,14,0.96);
      border-bottom: 1px solid rgba(240,184,64,0.12);
      position: sticky;
      top: 0;
      z-index: 200;
      backdrop-filter: blur(14px);
      gap: 12px;
    }
    .hd-logo h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .35em;
      background: linear-gradient(130deg, #c47020, #f0b840, #ffd060, #e09030);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .hd-logo p {
      font-size: 9px;
      letter-spacing: .25em;
      color: var(--dim);
      text-transform: uppercase;
      margin-top: 3px;
    }
    .hd-identity { text-align: center; flex: 1; min-width: 0; }
    #identity-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: .08em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #identity-sub { font-size: 11px; color: var(--dim); margin-top: 2px; }

    .hd-stability { text-align: right; min-width: 160px; }
    .stab-label { font-size: 9px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; margin-bottom: 5px; }
    .stab-bar { width: 160px; height: 5px; background: #0d0b18; border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
    #stab-fill { height: 100%; background: linear-gradient(90deg,#c47020,#f0b840); border-radius: 3px; transition: width .6s ease, background .6s ease; }
    #stab-score { font-size: 15px; font-weight: 700; color: var(--gold); margin-top: 3px; transition: color .4s; }

    /* ============================================================
       CITY CANVAS
    ============================================================ */
    .city-wrap { width: 100%; position: relative; background: #080510; overflow: hidden; }
    #cityCanvas { display: block; width: 100%; }
    .city-label-bar { display: flex; padding: 0 0 2px; background: rgba(8,5,16,0.95); border-bottom: 1px solid var(--border); }
    .district-label {
      flex: 1; text-align: center; font-size: 9px; letter-spacing: .18em;
      text-transform: uppercase; color: var(--dim); padding: 5px 0;
      border-right: 1px solid var(--border); transition: color .4s;
    }
    .district-label:last-child { border-right: none; }
    .district-label.active { color: var(--gold); }

    /* ============================================================
       ORDERS SECTION
    ============================================================ */
    .orders-section { padding: 20px 20px 8px; background: var(--bg2); }
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      max-width: 1500px;
      margin: 0 auto;
    }

    /* ============================================================
       ORDER CARD
    ============================================================ */
    .order-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 16px;
      position: relative;
      overflow: hidden;
      transition: border-color .3s, box-shadow .3s;
    }
    .order-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--oc); opacity: .35; transition: opacity .3s;
    }
    .order-card.is-fasting { border-color: color-mix(in srgb, var(--oc) 50%, transparent); box-shadow: 0 0 28px color-mix(in srgb, var(--oc) 14%, transparent); }
    .order-card.is-fasting::before { opacity: 1; animation: pulse-top 2s ease-in-out infinite; }
    .order-card.is-recovery::before { opacity: .7; background: var(--green); }
    @keyframes pulse-top { 0%,100%{ opacity:.5; } 50%{ opacity:1; } }

    .oc-label { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); margin-bottom: 3px; }
    .oc-duration { font-size: 30px; font-weight: 900; color: var(--oc); line-height: 1; letter-spacing: -.02em; }

    .rank-block { margin: 11px 0 10px; padding: 8px 10px; background: var(--bg); border-radius: 7px; border: 1px solid var(--border); }
    .rank-name { font-size: 12px; font-weight: 700; color: var(--oc); }
    .rank-cycles { font-size: 10px; color: var(--dim); margin-top: 2px; }

    .phase-row { display: flex; align-items: center; gap: 7px; margin: 9px 0 5px; }
    .phase-dot { width: 7px; height: 7px; border-radius: 50%; background: #2e2845; flex-shrink: 0; }
    .phase-dot.fasting { background: var(--blue); box-shadow: 0 0 8px var(--blue); animation: pdot 1.5s ease-in-out infinite; }
    .phase-dot.recovery { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pdot 2s ease-in-out infinite; }
    @keyframes pdot { 0%,100%{ opacity:.55; transform:scale(1); } 50%{ opacity:1; transform:scale(1.45); } }
    .phase-text { font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--dim); }
    .phase-text.fasting { color: var(--blue); }
    .phase-text.recovery { color: var(--green); }

    .timer { font-family: 'Courier New', monospace; font-size: 21px; font-weight: 700; letter-spacing: .05em; color: var(--text); margin: 6px 0 5px; }
    .timer.ready { color: var(--green); animation: timer-glow 1.5s ease-in-out infinite; }
    .timer.idle { color: var(--border); }
    @keyframes timer-glow { 0%,100%{ text-shadow:none; } 50%{ text-shadow:0 0 14px var(--green); } }

    .prog-bar { height: 3px; background: var(--bg); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
    .prog-fill { height: 100%; background: var(--oc); border-radius: 2px; transition: width 1s linear; }

    .stats-row { display: flex; margin: 8px 0; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; background: var(--bg); }
    .stat { flex: 1; text-align: center; padding: 7px 4px; border-right: 1px solid var(--border); }
    .stat:last-child { border-right: none; }
    .stat-val { font-size: 19px; font-weight: 800; color: var(--text); line-height: 1; }
    .stat.cracks .stat-val { color: var(--red); }
    .stat-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin-top: 2px; }

    .mastery-badge { font-size: 10px; color: var(--gold); background: rgba(240,184,64,.07); border: 1px solid rgba(240,184,64,.18); border-radius: 5px; padding: 4px 8px; margin: 7px 0; display: none; }
    .mastery-badge.visible { display: block; }

    .actions { display: flex; gap: 7px; margin-top: 11px; flex-wrap: wrap; }
    .btn { flex: 1; min-width: 70px; padding: 8px 10px; border: 1px solid transparent; border-radius: 7px; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; transition: all .2s; line-height: 1.2; }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); filter: brightness(1.2); }

    .btn-start { background: linear-gradient(135deg,#0e1c38,#163060); color: #70a8f0; border-color: #163060; }
    .btn-start:hover { background: linear-gradient(135deg,#163060,#2050a0); color: #a0c8ff; }

    .btn-seal { background: linear-gradient(135deg,#0a2010,#1a4428); color: #55aa70; border-color: #1a4428; }
    .btn-seal.ready { background: linear-gradient(135deg,#185028,#2a8845); color: #70e090; border-color: #2a8845; animation: btn-glow-g 2s ease-in-out infinite; }
    .btn-seal.locked { background: linear-gradient(135deg,#280808,#4e1010); color: #cc5050; border-color: #4e1010; }
    @keyframes btn-glow-g { 0%,100%{ box-shadow:none; } 50%{ box-shadow:0 0 14px rgba(76,217,138,.45); } }

    .btn-void { background: linear-gradient(135deg,#1e0808,#381010); color: #aa3838; border-color: #381010; }
    .btn-void:hover { background: linear-gradient(135deg,#381010,#681818); color: #dd5050; }

    .btn-recovery { background: linear-gradient(135deg,#081808,#102010); color: #3a7040; border-color: #102010; }
    .btn-recovery:hover { background: linear-gradient(135deg,#102010,#203020); color: #60a068; }

    /* ============================================================
       CHRONICLE
    ============================================================ */
    .chronicle-section { padding: 22px; background: var(--bg); border-top: 1px solid var(--border); }
    .chron-header { display: flex; align-items: center; justify-content: space-between; max-width: 1500px; margin: 0 auto 14px; }
    .chron-header h2 { font-size: 13px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
    .chron-count { font-size: 11px; color: var(--dim); }
    .chron-log { max-width: 1500px; margin: 0 auto; max-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--bg2); }
    .chron-entry { display: flex; gap: 12px; padding: 11px 16px; border-bottom: 1px solid #12101e; transition: background .2s; }
    .chron-entry:hover { background: var(--bg3); }
    .chron-entry:last-child { border-bottom: none; }
    .chron-icon { font-size: 15px; width: 22px; flex-shrink: 0; padding-top: 1px; text-align: center; }
    .chron-body { flex: 1; min-width: 0; }
    .chron-title { font-size: 11px; font-weight: 700; letter-spacing: .06em; }
    .chron-text { font-size: 12px; color: #b0a8c8; margin-top: 2px; line-height: 1.4; }
    .chron-time { font-size: 9px; color: var(--dim); margin-top: 3px; }
    .chron-empty { padding: 36px; text-align: center; color: var(--dim); font-style: italic; font-size: 13px; }

    /* ============================================================
       NOTIFICATIONS
    ============================================================ */
    .notif { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 999; padding: 13px 24px; border-radius: 10px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-align: center; pointer-events: none; animation: notif-in .3s ease; }
    .notif-crack { background: #200808; border: 1px solid #c03020; color: #ff7060; max-width: 380px; }
    .notif-milestone { background: #1a1200; border: 1px solid var(--gold); color: var(--gold-lt); max-width: 440px; }
    .notif-milestone .nm-sub { font-size: 11px; font-weight: 400; color: rgba(255,208,96,.65); margin-top: 5px; }
    @keyframes notif-in { from{ opacity:0; transform:translateX(-50%) translateY(-10px) scale(.93); } to{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); } }

    /* ============================================================
       FOOTER
    ============================================================ */
    footer { text-align: center; padding: 16px; font-size: 10px; color: var(--dim); letter-spacing: .15em; border-top: 1px solid var(--border); background: var(--bg); }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 1100px) { .orders-grid { grid-template-columns: repeat(3,1fr); } }
    @media (max-width: 680px)  { .orders-grid { grid-template-columns: repeat(2,1fr); } .hd-identity { display:none; } }
    @media (max-width: 440px)  { .orders-grid { grid-template-columns:1fr; } .hd-stability { min-width:unset; } .stab-bar { width:130px; } }
  </style>
</head>
<body>

<!-- HEADER -->
<header id="header">
  <div class="hd-logo">
    <h1>JOURNEY</h1>
    <p>The Cycle Protocol</p>
  </div>
  <div class="hd-identity">
    <div id="identity-title">The Uninitiated</div>
    <div id="identity-sub">No cycles sealed. The city awaits.</div>
  </div>
  <div class="hd-stability">
    <div class="stab-label">City Stability</div>
    <div class="stab-bar"><div id="stab-fill" style="width:100%"></div></div>
    <div id="stab-score">100%</div>
  </div>
</header>

<!-- CITY CANVAS -->
<div class="city-wrap">
  <canvas id="cityCanvas"></canvas>
</div>
<div class="city-label-bar" id="districtLabels"></div>

<!-- ORDERS -->
<section class="orders-section">
  <div class="orders-grid" id="ordersGrid"></div>
</section>

<!-- CHRONICLE -->
<section class="chronicle-section">
  <div class="chron-header">
    <h2>Chronicle</h2>
    <span class="chron-count" id="chronCount">0 entries</span>
  </div>
  <div class="chron-log" id="chronLog">
    <div class="chron-empty">The chronicle awaits your first cycle…</div>
  </div>
</section>

<footer>JOURNEY — THE CYCLE PROTOCOL &nbsp;·&nbsp; Return to control, again and again, over time.</footer>

<script>
'use strict';

/* ============================================================
   ORDERS — warm LA palette
============================================================ */
const ORDERS = [
  { id:'12h',  dur:12,  label:'12H',  district:'THE QUARTER',  color:'#c49a6c', rgb:'196,154,108' },
  { id:'24h',  dur:24,  label:'24H',  district:'THE WARD',     color:'#5bb8d4', rgb:'91,184,212'  },
  { id:'48h',  dur:48,  label:'48H',  district:'THE DISTRICT', color:'#d4814a', rgb:'212,129,74'  },
  { id:'72h',  dur:72,  label:'72H',  district:'THE SECTOR',   color:'#b89fd8', rgb:'184,159,216' },
  { id:'144h', dur:144, label:'144H', district:'THE CITADEL',  color:'#f0b840', rgb:'240,184,64'  },
];

/* ============================================================
   LORE
============================================================ */
const LORE = {
  start: [
    'The foundation stones are set. The fast begins beneath the California sun.',
    'Silence descends. The city watches and waits.',
    'Another cycle opens. The architects record it in warm stone.',
    'The district stirs. Phase locked. The tower ascends the skyline.',
    'Control assumes its position. The city holds its breath.',
    'The builders raise their tools. Time begins its measure.',
    'A gate opens to the void. The fast holds it shut.',
    'Phase engaged. The skyline leans into the golden hour.',
  ],
  seal: [
    'The cycle closes. Another floor rises toward the LA sun.',
    'Discipline honored. The city grows skyward.',
    'Sealed and complete. The pattern holds.',
    'The tower claims another level. The architects record the ascent.',
    'A cycle returned to the record. One more floor claimed.',
    'The seal is set. Structure solidifies against the dusk.',
    'Completion claimed. The city etches another floor into the hillside.',
    'The fast is honored. The building stands taller than yesterday.',
  ],
  void: [
    'A fracture appears. The cycle breaks and the district absorbs the damage.',
    'Structural damage recorded. The crack runs deep into the warm concrete.',
    'The void is accepted. Red lines mark the failure in the facade.',
    'Failure logged. The fissure will remain in the stone forever.',
    'The discipline falters. Cracks split the stucco facade.',
    'A fissure opens. This too is part of the permanent record.',
    'The cycle breaks. The city endures the Santa Ana winds of failure.',
    'Voided. The fracture lines are now permanent architecture.',
  ],
  early: [
    'Phase-lock violated. Structural damage recorded in the foundation.',
    'The seal is rejected — the phase is not complete. Crack logged.',
    'Early breach noted. The tower fractures at its sun-baked base.',
    'The architects refuse the seal. Structural integrity suffers.',
    'Cannot seal — the vigil is unfinished. The crack is permanent.',
    'Phase incomplete. The building records the attempt as structural damage.',
  ],
  rankUp: {
    3: [
      'Third Gate achieved. The pattern is no longer accident.',
      'Three times returned. The district recognizes your name.',
      'Third Gate: first proof of repetition. The city etches it in gold.',
      'The gate opens at three. You have proven you can return.',
    ],
    6: [
      'Sixth Path — the spire breaks the LA skyline.',
      'Six cycles mastered. A spire crowns the tower above the smog line.',
      'The Sixth Path is real. Structure solidifies into the golden skyline.',
      'At six, the spire rises above the Hollywood Hills.',
    ],
    9: [
      'Ninth Seal set. The crown burns gold over the basin forever.',
      'Nine cycles. The building is complete. You are complete.',
      'The Ninth Seal is permanent. The crown glows for all of Los Angeles.',
      'Nine returns. Discipline internalized. The city belongs to you.',
    ],
  },
  special144: 'Sovereign Architect — The Metropolis is complete. You are the city.',
  recovery: [
    'The district rests beneath the LA moon. The builders await.',
    'Recovery phase ends. The district stands ready for the next ascent.',
    'Stillness returns to the canyon. The city prepares.',
  ],
};

function pickLore(pool) { return pool[Math.floor(Math.random() * pool.length)]; }

/* ============================================================
   RANK TIERS
============================================================ */
const RANKS = [
  { min:9, name:'Ninth Seal',  sym:'◉', tier:9 },
  { min:6, name:'Sixth Path',  sym:'◈', tier:6 },
  { min:3, name:'Third Gate',  sym:'◇', tier:3 },
  { min:1, name:'Initiate',    sym:'○', tier:1 },
  { min:0, name:'Dormant',     sym:'·', tier:0 },
];
function getRank(cycles) { return RANKS.find(r => cycles >= r.min) || RANKS[RANKS.length-1]; }

/* ============================================================
   STATE
============================================================ */
const SK = 'journey_v2';
let state = { orders:{}, chronicle:[], totalCycles:0, totalCracks:0 };

function freshOrder() { return { cycles:0, cracks:0, phase:'idle', phaseStart:null, phaseEnd:null }; }

function initState() {
  try {
    const raw = localStorage.getItem(SK);
    if (raw) {
      state = JSON.parse(raw);
      ORDERS.forEach(o => { if (!state.orders[o.id]) state.orders[o.id] = freshOrder(); });
      return;
    }
  } catch(err) {
    console.warn('[Journey] Failed to restore saved state — starting fresh.', err);
  }
  state = { orders:{}, chronicle:[], totalCycles:0, totalCracks:0 };
  ORDERS.forEach(o => { state.orders[o.id] = freshOrder(); });
}
function saveState() { try { localStorage.setItem(SK, JSON.stringify(state)); } catch(err) { console.warn('[Journey] Could not persist state.', err); } }

/* ============================================================
   CALCULATIONS
============================================================ */
function getMasteryBonus(orderId) {
  const idx = ORDERS.findIndex(o => o.id === orderId);
  if (idx <= 0) return 0;
  let bonus = 0;
  for (let i = 0; i < idx; i++) bonus += state.orders[ORDERS[i].id].cycles * (idx - i) * 0.5;
  return Math.round(bonus * 10) / 10;
}

function getStability() {
  const total = state.totalCycles + state.totalCracks;
  return total === 0 ? 100 : Math.round((state.totalCycles / total) * 100);
}

function getIdentity() {
  let best = { tier:0, dur:0, orderId:null, cycles:0 };
  ORDERS.forEach(o => {
    const r = getRank(state.orders[o.id].cycles);
    if (r.tier > best.tier || (r.tier === best.tier && o.dur > best.dur))
      best = { tier:r.tier, dur:o.dur, orderId:o.id, cycles:state.orders[o.id].cycles };
  });
  if (!best.orderId || best.tier === 0) return { title:'The Uninitiated', sub:'No cycles sealed. The city awaits.' };
  if (best.tier === 9 && best.orderId === '144h') return { title:'Sovereign Architect', sub:LORE.special144 };
  const oLabel = ORDERS.find(o => o.id === best.orderId).label;
  const rank   = getRank(best.cycles);
  if (best.tier === 9) return { title:`${rank.name} — ${oLabel}`, sub:`Nine cycles of ${best.dur}h. The crown burns.` };
  if (best.tier === 6) return { title:`${rank.name} — ${oLabel}`, sub:`Six cycles of ${best.dur}h. The spire rises.` };
  if (best.tier === 3) return { title:`${rank.name} — ${oLabel}`, sub:`Third Gate of ${best.dur}h. First proof of repetition.` };
  return { title:`Initiate — ${oLabel}`, sub:`${best.cycles} cycle${best.cycles!==1?'s':''} sealed.` };
}

function getProgress(orderId) {
  const os = state.orders[orderId];
  if (os.phase !== 'fasting' || !os.phaseStart || !os.phaseEnd) return 0;
  return Math.min(1, (Date.now() - os.phaseStart) / (os.phaseEnd - os.phaseStart));
}
function getRemaining(orderId) {
  const os = state.orders[orderId];
  return os.phaseEnd ? Math.max(0, os.phaseEnd - Date.now()) : 0;
}
function isComplete(orderId) {
  const os = state.orders[orderId];
  return os.phase === 'fasting' && os.phaseEnd && Date.now() >= os.phaseEnd;
}
function fmtMs(ms) {
  if (ms <= 0) return '00:00:00';
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function fmtNow() {
  return new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

/* ============================================================
   CHRONICLE
============================================================ */
function chronicle(icon, title, text, orderId) {
  const o = ORDERS.find(x => x.id === orderId);
  state.chronicle.unshift({ icon, title, text, color:o.color, ts:fmtNow() });
  if (state.chronicle.length > 120) state.chronicle.length = 120;
}

/* ============================================================
   ACTIONS
============================================================ */
function startFasting(orderId) {
  const os = state.orders[orderId];
  if (os.phase !== 'idle') return;
  const o = ORDERS.find(x => x.id === orderId);
  os.phase = 'fasting'; os.phaseStart = Date.now(); os.phaseEnd = Date.now() + o.dur * 3600000;
  chronicle('▶', `${o.district}: Vigil commenced.`, pickLore(LORE.start), orderId);
  saveState(); fullRender();
}

function sealCycle(orderId) {
  const os = state.orders[orderId];
  if (os.phase !== 'fasting') return;
  const o = ORDERS.find(x => x.id === orderId), now = Date.now();
  if (now < os.phaseEnd) {
    os.cracks++; state.totalCracks++;
    chronicle('⚡',`${o.district}: Phase-lock violated — early seal rejected.`, pickLore(LORE.early), orderId);
    showNotif('crack','⚑ Phase incomplete — structural damage recorded');
    saveState(); fullRender(); return;
  }
  const prevRank = getRank(os.cycles);
  os.cycles++; state.totalCycles++;
  const newRank = getRank(os.cycles);
  os.phase = 'recovery'; os.phaseStart = now; os.phaseEnd = now + o.dur * 3600000;
  let loreText = pickLore(LORE.seal);
  if (newRank.tier > prevRank.tier) {
    const pool = LORE.rankUp[newRank.tier];
    if (pool) loreText = pickLore(pool);
    if (orderId === '144h' && newRank.tier === 9) loreText = LORE.special144;
    showNotif('milestone', `${newRank.sym} ${newRank.name} — ${o.label}`, loreText);
    chronicle('🏛',`${o.district}: ${newRank.name} achieved.`, loreText, orderId);
  } else {
    chronicle('◆',`${o.district}: Cycle ${os.cycles} sealed.`, loreText, orderId);
  }
  saveState(); fullRender();
}

function voidCycle(orderId) {
  const os = state.orders[orderId];
  if (os.phase !== 'fasting') return;
  const o = ORDERS.find(x => x.id === orderId);
  os.cracks++; state.totalCracks++;
  os.phase = 'idle'; os.phaseStart = null; os.phaseEnd = null;
  chronicle('⚑',`${o.district}: Cycle voided.`, pickLore(LORE.void), orderId);
  showNotif('crack','⚑ Cycle voided — crack recorded in the stone');
  saveState(); fullRender();
}

function endRecovery(orderId) {
  const os = state.orders[orderId];
  if (os.phase !== 'recovery') return;
  const o = ORDERS.find(x => x.id === orderId);
  os.phase = 'idle'; os.phaseStart = null; os.phaseEnd = null;
  chronicle('◎',`${o.district}: Recovery complete.`, pickLore(LORE.recovery), orderId);
  saveState(); fullRender();
}

/* ============================================================
   NOTIFICATIONS
============================================================ */
function showNotif(type, line1, line2) {
  document.querySelectorAll('.notif').forEach(n => n.remove());
  const el = document.createElement('div');
  el.className = `notif notif-${type}`;
  el.innerHTML = type === 'milestone'
    ? `<div>${line1}</div>${line2?`<div class="nm-sub">${line2}</div>`:''}`
    : line1;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), type === 'milestone' ? 5500 : 3200);
}

/* ============================================================
   CANVAS — ISOMETRIC CITY
============================================================ */
const canvas = document.getElementById('cityCanvas');
const ctx    = canvas.getContext('2d');
let stars = [], frame = 0;

/* -- Isometric tile dimensions (updated on resize) -- */
let TW = 56, TH = 28; // tile screen-width / tile screen-height (TH = TW/2)

/* Canvas tile ratio: approx tiles that should fit across canvas width */
const CANVAS_TILE_RATIO = 21;
/* Star density: one star per this many canvas pixels² */
const STAR_DENSITY_DIVISOR = 3400;
/* Building height stops growing visually after this many cycles */
const MAX_VISUAL_CYCLES = 12;
/* Spire geometry constants */
const SPIRE_BASE_RATIO  = 0.22; // spire base radius as fraction of min(bw,bd)
const SPIRE_BASE_HEIGHT = 48;   // minimum additional height for the spire above rooftop
const SPIRE_SCALE_FACTOR = 14;  // extra height added per grid unit of footprint size
/* Window density constants */
const WINDOW_COLS_PER_UNIT = 2.5; // columns of windows per grid unit of building width
const WINDOW_ROW_HEIGHT_PX = 30;  // approx screen-pixels per row of windows

/* -- seed-based PRNG for consistent procedural details -- */
function seededRand(seed) {
  let current = seed;
  return function() { current = (current * 9301 + 49297) % 233280; return current / 233280; };
}

function resizeCanvas() {
  const W = canvas.offsetWidth || window.innerWidth;
  // Slightly taller canvas gives the isometric city more vertical room
  const H = Math.round(Math.max(420, Math.min(580, W * 0.40)));
  canvas.width  = W;
  canvas.height = H;
  // Responsive tile: wider canvases get bigger tiles
  TW = Math.max(42, Math.min(72, W / CANVAS_TILE_RATIO));
  TH = TW / 2;
}

function genStars() {
  stars = [];
  const n = Math.floor(canvas.width * canvas.height / STAR_DENSITY_DIVISOR);
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height * 0.65, // stars only in sky portion
      r: Math.random() * 1.2 + 0.3,
      b: Math.random() * 0.55 + 0.2,
      s: Math.random() * Math.PI * 2,
    });
  }
}

/* -- helpers -- */
function rgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ============================================================
   ISOMETRIC MATH
   Projection: gx → right+down, gy → left+down, gz → up
   Origin (ox, oy) is where grid tile (0, 0, 0) appears on screen.
============================================================ */
function isoP(gx, gy, gz, ox, oy) {
  return {
    x: ox + (gx - gy) * (TW / 2),
    y: oy + (gx + gy) * (TH / 2) - gz,
  };
}

function isoPoly(pts, fillStyle) {
  if (pts.length < 3) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fillStyle = fillStyle;
  ctx.fill();
}

function isoEdge(pts, strokeStyle, lw) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.strokeStyle = strokeStyle;
  ctx.lineWidth   = lw || 0.5;
  ctx.stroke();
}

/* -- Ground tile: a flat isometric diamond -- */
function drawGroundTile(gx, gy, fillStyle, ox, oy) {
  const A = isoP(gx,   gy,   0, ox, oy);
  const B = isoP(gx+1, gy,   0, ox, oy);
  const C = isoP(gx+1, gy+1, 0, ox, oy);
  const D = isoP(gx,   gy+1, 0, ox, oy);
  isoPoly([A, B, C, D], fillStyle);
  isoEdge([A, B, C, D], 'rgba(0,0,0,0.20)', 0.4);
}

/* -- Isometric building box: top face + right face + left face -- */
function drawIsoBox(gx, gy, bw, bd, heightPx, colTop, colRight, colLeft, ox, oy) {
  const h  = heightPx;
  // Ground corners
  const A  = isoP(gx,    gy,    0, ox, oy); // front vertex (closest)
  const B  = isoP(gx+bw, gy,    0, ox, oy); // right
  const C  = isoP(gx+bw, gy+bd, 0, ox, oy); // back
  const D  = isoP(gx,    gy+bd, 0, ox, oy); // left
  // Top corners (same xy, lifted by h)
  const At = isoP(gx,    gy,    h, ox, oy);
  const Bt = isoP(gx+bw, gy,    h, ox, oy);
  const Ct = isoP(gx+bw, gy+bd, h, ox, oy);
  const Dt = isoP(gx,    gy+bd, h, ox, oy);

  // Right face (A→B→Bt→At) — faces screen lower-right
  isoPoly([A, B, Bt, At], colRight);
  isoEdge([A, B, Bt, At], 'rgba(0,0,0,0.28)', 0.5);
  // Left face (A→D→Dt→At) — faces screen lower-left (in shadow)
  isoPoly([A, D, Dt, At], colLeft);
  isoEdge([A, D, Dt, At], 'rgba(0,0,0,0.22)', 0.5);
  // Top face (rooftop, brightest)
  isoPoly([At, Bt, Ct, Dt], colTop);
  isoEdge([At, Bt, Ct, Dt], 'rgba(0,0,0,0.22)', 0.5);
}

/* -- Windows drawn on both visible side faces via parametric interpolation -- */
function drawIsoWindows(gx, gy, bw, bd, heightPx, distColor, seed, ox, oy) {
  if (heightPx < 18) return;
  const h  = heightPx;
  const cr = parseInt(distColor.slice(1,3),16);
  const cg = parseInt(distColor.slice(3,5),16);
  const cb = parseInt(distColor.slice(5,7),16);
  const litCol   = `rgba(${Math.min(255,cr+110)},${Math.min(255,cg+90)},${Math.min(255,cb+30)},0.90)`;
  const unlitCol = 'rgba(0,0,0,0.68)';

  // Right face  (A → B for width, A → At for height)
  {
    const A  = isoP(gx,    gy, 0, ox, oy);
    const B  = isoP(gx+bw, gy, 0, ox, oy);
    const At = isoP(gx,    gy, h, ox, oy);
    const cols = Math.max(1, Math.ceil(bw * WINDOW_COLS_PER_UNIT));
    const rows = Math.max(1, Math.ceil(h / WINDOW_ROW_HEIGHT_PX));
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        // Pseudo-random lit pattern: ~75% of windows lit (3 out of every 4)
        const lit = ((seed * 7 + row * 31 + col * 17) % 4) !== 0;
        const u   = (col + 0.55) / cols;  // across width
        const v   = (row + 0.30) / rows;  // up height
        const px  = A.x + (B.x  - A.x) * u + (At.x - A.x) * v;
        const py  = A.y + (B.y  - A.y) * u + (At.y - A.y) * v;
        ctx.fillStyle = lit ? litCol : unlitCol;
        ctx.fillRect(px - 2, py - 2, 4, 3);
      }
    }
  }
  // Left face  (A → D for width, A → At for height)
  {
    const A  = isoP(gx, gy,    0, ox, oy);
    const D  = isoP(gx, gy+bd, 0, ox, oy);
    const At = isoP(gx, gy,    h, ox, oy);
    const cols = Math.max(1, Math.ceil(bd * WINDOW_COLS_PER_UNIT));
    const rows = Math.max(1, Math.ceil(h / WINDOW_ROW_HEIGHT_PX));
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const lit = ((seed * 11 + row * 23 + col * 37) % 4) !== 0;
        const u   = (col + 0.55) / cols;
        const v   = (row + 0.30) / rows;
        const px  = A.x + (D.x  - A.x) * u + (At.x - A.x) * v;
        const py  = A.y + (D.y  - A.y) * u + (At.y - A.y) * v;
        ctx.fillStyle = lit ? litCol : unlitCol;
        ctx.fillRect(px - 2, py - 2, 4, 3);
      }
    }
  }
}

/* -- Red crack fracture lines drawn on the left (shadow) face -- */
function drawIsoCracks(gx, gy, bd, heightPx, numCracks, seed, ox, oy) {
  if (numCracks <= 0 || heightPx < 12) return;
  const h  = heightPx;
  const A  = isoP(gx, gy,    0, ox, oy);
  const D  = isoP(gx, gy+bd, 0, ox, oy);
  const At = isoP(gx, gy,    h, ox, oy);
  const Dt = isoP(gx, gy+bd, h, ox, oy);
  ctx.save();
  // Clip to the left face polygon
  ctx.beginPath();
  ctx.moveTo(A.x,A.y); ctx.lineTo(D.x,D.y); ctx.lineTo(Dt.x,Dt.y); ctx.lineTo(At.x,At.y);
  ctx.closePath(); ctx.clip();

  for (let i = 0; i < Math.min(numCracks, 5); i++) {
    const u0 = ((seed * 13 + i * 37) % 70 + 15) / 100;
    const v0 = ((seed * 7  + i * 23) % 35 + 10) / 100;
    let px = A.x + (D.x - A.x) * u0 + (At.x - A.x) * v0;
    let py = A.y + (D.y - A.y) * u0 + (At.y - A.y) * v0;
    ctx.beginPath(); ctx.moveTo(px, py);
    for (let seg = 0; seg < 7; seg++) {
      const du = ((seed * 11 + i * 29 + seg * 17) % 22 - 11) / 75;
      const dv = ((seed * 17 + i * 13 + seg * 31) % 14 + 3) / 100;
      px += (D.x - A.x) * du + (At.x - A.x) * dv;
      py += (D.y - A.y) * du + (At.y - A.y) * dv;
      ctx.lineTo(px, py);
    }
    ctx.strokeStyle = '#d02828'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.92; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* -- Isometric spire at top of building (rank 6) -- */
function drawIsoSpire(gx, gy, bw, bd, topZ, color, ox, oy) {
  const cx = gx + bw / 2, cy = gy + bd / 2;
  const r  = Math.min(bw, bd) * SPIRE_BASE_RATIO;
  const spireH = topZ + SPIRE_BASE_HEIGHT + Math.min(bw, bd) * SPIRE_SCALE_FACTOR;
  const tipPt = isoP(cx, cy, spireH, ox, oy);
  // 4 base corners of spire diamond
  const bA = isoP(cx,   cy-r, topZ, ox, oy);
  const bB = isoP(cx+r, cy,   topZ, ox, oy);
  const bC = isoP(cx,   cy+r, topZ, ox, oy);
  const bD = isoP(cx-r, cy,   topZ, ox, oy);
  // Draw 4 triangular faces (front two are most visible)
  isoPoly([bA, bB, tipPt], rgba(color, 0.95));
  isoPoly([bB, bC, tipPt], rgba(color, 0.70));
  isoPoly([bC, bD, tipPt], rgba(color, 0.45));
  isoPoly([bD, bA, tipPt], rgba(color, 0.75));
  // Glowing tip
  ctx.shadowBlur = 18; ctx.shadowColor = color;
  ctx.beginPath(); ctx.arc(tipPt.x, tipPt.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
  ctx.shadowBlur = 0;
}

/* -- Gold crown glow at rank 9 -- */
function drawIsoCrown(gx, gy, bw, bd, topZ, ox, oy) {
  const cx  = gx + bw / 2, cy = gy + bd / 2;
  const spireH = topZ + SPIRE_BASE_HEIGHT + Math.min(bw, bd) * SPIRE_SCALE_FACTOR;
  const tip = isoP(cx, cy, spireH, ox, oy);
  const pulse = 1 + 0.14 * Math.sin(frame * 0.04);
  const r = 8 * pulse;
  const ag = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, r * 4.5);
  ag.addColorStop(0,    'rgba(255,200,64,0.88)');
  ag.addColorStop(0.35, 'rgba(240,150,30,0.38)');
  ag.addColorStop(1,    'transparent');
  ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(tip.x, tip.y, r * 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(tip.x, tip.y, r, 0, Math.PI * 2);
  ctx.fillStyle = '#f0b840'; ctx.fill();
  ctx.strokeStyle = '#ffd060'; ctx.lineWidth = 1.5; ctx.stroke();
}

/* -- Building height: base + capped per-cycle growth -- */
function bldH(cycles, base, pf) { return base + Math.min(cycles, MAX_VISUAL_CYCLES) * pf; }

/* ============================================================
   ISOMETRIC DISTRICT DEFINITIONS
   City grid: gx 0..9 right, gy 0..9 left.
   Quadrants separated by road at gx=4 and gy=4.
     QUARTER (12h):  gx 0-3, gy 0-3  back-left
     WARD    (24h):  gx 5-8, gy 0-3  back-right
     CITADEL (144h): gx 4-5, gy 4-5  center
     DISTRICT(48h):  gx 0-3, gy 5-8  front-left
     SECTOR  (72h):  gx 5-8, gy 5-8  front-right
   Draw order (back→front by min gx+gy):  QUARTER→WARD→CITADEL→DISTRICT→SECTOR
============================================================ */
const ISO_CITY = {
  /* Sandy stucco cluster — 3 buildings of varying height */
  '12h': {
    groundColor: '#14110b',
    buildings: [
      { gx:0, gy:0, bw:2, bd:2, base:22, pf:14, hm:1.00, seed:12  },
      { gx:2, gy:1, bw:1, bd:2, base:18, pf:11, hm:0.78, seed:23  },
      { gx:0, gy:2, bw:2, bd:1, base:16, pf: 9, hm:0.65, seed:34  },
    ],
    colTop:'#2e2010', colRight:'#221808', colLeft:'#160e04',
  },
  /* Reflective glass tower pair */
  '24h': {
    groundColor: '#0a1018',
    buildings: [
      { gx:5, gy:0, bw:2, bd:2, base:30, pf:20, hm:1.00, seed:24  },
      { gx:7, gy:1, bw:1, bd:2, base:22, pf:16, hm:0.72, seed:35  },
    ],
    colTop:'#0c2232', colRight:'#0a1828', colLeft:'#060e1a',
  },
  /* Industrial brick warehouse */
  '48h': {
    groundColor: '#180b04',
    buildings: [
      { gx:0, gy:5, bw:3, bd:2, base:26, pf:17, hm:1.00, seed:48  },
      { gx:1, gy:7, bw:2, bd:1, base:18, pf:12, hm:0.70, seed:59  },
    ],
    colTop:'#2e1508', colRight:'#201004', colLeft:'#140800',
  },
  /* Wide civic hall */
  '72h': {
    groundColor: '#0e0c18',
    buildings: [
      { gx:5, gy:5, bw:4, bd:2, base:32, pf:22, hm:1.00, seed:72  },
    ],
    colTop:'#1e1232', colRight:'#140a22', colLeft:'#0c0618',
  },
  /* Central gold monolith — the Citadel */
  '144h': {
    groundColor: '#160f00',
    buildings: [
      { gx:4, gy:4, bw:2, bd:2, base:44, pf:26, hm:1.00, seed:144 },
    ],
    colTop:'#2e2008', colRight:'#201600', colLeft:'#160e00',
  },
};

/* -- Draw one district's buildings -- */
function drawIsoDistrict(order, os, ox, oy) {
  const def    = ISO_CITY[order.id];
  const cycles = os.cycles;
  const cracks = os.cracks;
  const active = os.phase === 'fasting';

  def.buildings.forEach((b, bi) => {
    const height = bldH(cycles, b.base, b.pf) * b.hm;

    // Active fasting: pulsing glow around main building
    if (active && bi === 0) {
      const pulse = 0.18 + 0.12 * Math.sin(frame * 0.05);
      const midPt = isoP(b.gx + b.bw * 0.5, b.gy + b.bd * 0.5, height * 0.4, ox, oy);
      const gl = ctx.createRadialGradient(midPt.x, midPt.y, 0, midPt.x, midPt.y, TW * 3.5);
      gl.addColorStop(0, rgba(order.color, pulse * 0.75));
      gl.addColorStop(1, 'transparent');
      ctx.fillStyle = gl;
      ctx.fillRect(midPt.x - TW * 3.5, midPt.y - TW * 3.5, TW * 7, TW * 7);
    }

    // Draw the 3-face isometric box
    drawIsoBox(b.gx, b.gy, b.bw, b.bd, height,
               def.colTop, def.colRight, def.colLeft, ox, oy);

    // District colour tint overlay on each face
    const A  = isoP(b.gx,      b.gy,      0,      ox, oy);
    const B  = isoP(b.gx+b.bw, b.gy,      0,      ox, oy);
    const D  = isoP(b.gx,      b.gy+b.bd, 0,      ox, oy);
    const At = isoP(b.gx,      b.gy,      height, ox, oy);
    const Bt = isoP(b.gx+b.bw, b.gy,      height, ox, oy);
    const Ct = isoP(b.gx+b.bw, b.gy+b.bd, height, ox, oy);
    const Dt = isoP(b.gx,      b.gy+b.bd, height, ox, oy);
    isoPoly([A, B, Bt, At],   rgba(order.color, 0.06));
    isoPoly([A, D, Dt, At],   rgba(order.color, 0.04));
    isoPoly([At, Bt, Ct, Dt], rgba(order.color, 0.10));

    // Windows (only when at least 1 cycle sealed)
    if (cycles > 0) {
      drawIsoWindows(b.gx, b.gy, b.bw, b.bd, height, order.color, b.seed + bi * 3, ox, oy);
    }

    // Crack lines on left face
    if (cracks > 0) {
      drawIsoCracks(b.gx, b.gy, b.bd, height, cracks, b.seed + bi * 7, ox, oy);
    }

    // Spire at rank 6 (main building only)
    if (cycles >= 6 && bi === 0) {
      drawIsoSpire(b.gx, b.gy, b.bw, b.bd, height, order.color, ox, oy);
    }

    // Crown at rank 9 (main building only)
    if (cycles >= 9 && bi === 0) {
      drawIsoCrown(b.gx, b.gy, b.bw, b.bd, height, ox, oy);
    }

    // Sovereign aura rings — Citadel rank 9 only
    if (order.id === '144h' && cycles >= 9 && bi === 0) {
      const spireH = height + SPIRE_BASE_HEIGHT + Math.min(b.bw, b.bd) * SPIRE_SCALE_FACTOR;
      const tip = isoP(b.gx + b.bw / 2, b.gy + b.bd / 2, spireH, ox, oy);
      const a1 = 0.38 + 0.22 * Math.sin(frame * 0.04);
      const a2 = 0.18 + 0.16 * Math.sin(frame * 0.04 + 1.6);
      ctx.beginPath(); ctx.arc(tip.x, tip.y, 26, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,200,64,${a1})`; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(tip.x, tip.y, 40, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,180,40,${a2})`; ctx.lineWidth = 1; ctx.stroke();
    }
  });
}

/* ---- MAIN CITY DRAW ---- */
function drawCity() {
  frame++;
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  /* -- LA Dusk Sky gradient — full canvas background -- */
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0,    '#0d0620'); // deep violet zenith
  sky.addColorStop(0.22, '#250a3e'); // rich purple
  sky.addColorStop(0.46, '#7a1e4a'); // magenta belt
  sky.addColorStop(0.66, '#c0401e'); // deep coral
  sky.addColorStop(0.80, '#e07020'); // burnt orange
  sky.addColorStop(0.92, '#e89a28'); // warm amber
  sky.addColorStop(1,    '#c07818'); // golden haze at horizon
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  /* -- Sun glow at horizon -- */
  const sG = ctx.createRadialGradient(W * 0.68, H, 0, W * 0.68, H, W * 0.48);
  sG.addColorStop(0, 'rgba(255,200,80,0.34)');
  sG.addColorStop(0.3, 'rgba(240,120,30,0.14)');
  sG.addColorStop(1, 'transparent');
  ctx.fillStyle = sG; ctx.fillRect(0, 0, W, H);

  /* -- Stars -- */
  stars.forEach(st => {
    const tw = 0.5 + 0.5 * Math.sin(frame * 0.016 + st.s);
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,230,200,${st.b * tw * 0.65})`; ctx.fill();
  });

  /* -- Venus / first star -- */
  const vs = 1 + 0.28 * Math.sin(frame * 0.04);
  const vg = ctx.createRadialGradient(W * 0.12, H * 0.07, 0, W * 0.12, H * 0.07, vs * 7);
  vg.addColorStop(0, 'rgba(255,240,180,0.48)'); vg.addColorStop(1, 'transparent');
  ctx.fillStyle = vg; ctx.beginPath(); ctx.arc(W * 0.12, H * 0.07, vs * 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W * 0.12, H * 0.07, vs * 2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,240,180,0.92)'; ctx.fill();

  /* ---- ISOMETRIC CITY ---- */
  // Origin: buildings extend up into the sky, ground tiles extend toward canvas bottom
  const ox = Math.round(W * 0.50);
  const oy = Math.round(H * 0.48);

  /* -- Ground tile grid (roads + district pads) -- */
  // Road colour (cross at gx=4 and gy=4)
  const ROAD_COL   = '#0b0910';
  // District zone ground tiles
  const distGrounds = {
    '12h':  { gxMin:0, gyMin:0, gxMax:4, gyMax:4,  col:'#16120c' },
    '24h':  { gxMin:5, gyMin:0, gxMax:9, gyMax:4,  col:'#0b1118' },
    '48h':  { gxMin:0, gyMin:5, gxMax:4, gyMax:9,  col:'#160c06' },
    '72h':  { gxMin:5, gyMin:5, gxMax:9, gyMax:9,  col:'#0e0c1a' },
    '144h': { gxMin:4, gyMin:4, gxMax:6, gyMax:6,  col:'#181200' },
  };
  // Draw all ground tiles back→front (sorted by gx+gy ascending)
  // Max sum = 9+9 = 18, but grid includes -1..10 border tiles so cap at 16
  const MAX_GRID_SUM = 16; // derived from 10×10 grid bounds (-1..10 range each axis)
  for (let sum = 0; sum <= MAX_GRID_SUM; sum++) {
    for (let gx = Math.max(-1, sum - 10); gx <= Math.min(10, sum + 1); gx++) {
      const gy = sum - gx;
      if (gy < -1 || gy > 10) continue;
      // Pick tile colour
      let col = ROAD_COL;
      if (gx === 4 || gy === 4) { col = ROAD_COL; }
      else {
        for (const id of Object.keys(distGrounds)) {
          const dg = distGrounds[id];
          if (gx >= dg.gxMin && gx < dg.gxMax && gy >= dg.gyMin && gy < dg.gyMax) {
            col = dg.col; break;
          }
        }
      }
      drawGroundTile(gx, gy, col, ox, oy);
    }
  }

  /* -- Road centre-line dashes -- */
  for (let t = -1; t <= 9; t++) {
    // Along gx=4 (gy varies)
    const rA = isoP(4.45, t + 0.2, 0.5, ox, oy);
    const rB = isoP(4.45, t + 0.8, 0.5, ox, oy);
    ctx.beginPath(); ctx.moveTo(rA.x, rA.y); ctx.lineTo(rB.x, rB.y);
    ctx.strokeStyle = 'rgba(180,130,40,0.18)'; ctx.lineWidth = 1; ctx.stroke();
    // Along gy=4 (gx varies)
    const rC = isoP(t + 0.2, 4.45, 0.5, ox, oy);
    const rD = isoP(t + 0.8, 4.45, 0.5, ox, oy);
    ctx.beginPath(); ctx.moveTo(rC.x, rC.y); ctx.lineTo(rD.x, rD.y);
    ctx.strokeStyle = 'rgba(180,130,40,0.18)'; ctx.lineWidth = 1; ctx.stroke();
  }

  /* -- Draw districts back→front for correct painter's-algorithm depth -- */
  // Order by minimum (gx+gy) of each district's first building:
  //   12h (0+0=0) → 24h (5+0=5) → 48h (0+5=5) → 144h (4+4=8) → 72h (5+5=10)
  const DRAW_ORDER = ['12h', '24h', '48h', '144h', '72h'];
  DRAW_ORDER.forEach(id => {
    const o  = ORDERS.find(x => x.id === id);
    const os = state.orders[id];
    drawIsoDistrict(o, os, ox, oy);
  });

  /* -- Update district label active states -- */
  const lbls = document.querySelectorAll('.district-label');
  ORDERS.forEach((o, i) => {
    if (!lbls[i]) return;
    const active = state.orders[o.id].phase === 'fasting';
    lbls[i].classList.toggle('active', active);
    lbls[i].style.color = active ? o.color : '';
  });
}

/* ============================================================
   UI RENDER
============================================================ */
function renderIdentity() {
  const id = getIdentity();
  document.getElementById('identity-title').textContent = id.title;
  document.getElementById('identity-sub').textContent   = id.sub;
}

function renderStability() {
  const s=getStability();
  document.getElementById('stab-fill').style.width = s+'%';
  document.getElementById('stab-score').textContent = s+'%';
  const sf=document.getElementById('stab-fill'), sc=document.getElementById('stab-score');
  if      (s>=80){ sf.style.background='linear-gradient(90deg,#c47020,#f0b840)'; sc.style.color='#f0b840'; }
  else if (s>=60){ sf.style.background='linear-gradient(90deg,#b05010,#e07020)'; sc.style.color='#e07020'; }
  else if (s>=40){ sf.style.background='linear-gradient(90deg,#8a1818,#c02828)'; sc.style.color='#e03030'; }
  else           { sf.style.background='linear-gradient(90deg,#601010,#b01818)'; sc.style.color='#d02020'; }
}

function renderCards() {
  const grid=document.getElementById('ordersGrid');
  grid.innerHTML='';
  ORDERS.forEach(o => {
    const os=state.orders[o.id], rank=getRank(os.cycles);
    const rem=getRemaining(o.id), prog=getProgress(o.id);
    const ready=isComplete(o.id), mas=getMasteryBonus(o.id);
    let phaseHtml='', actionsHtml='';

    if (os.phase==='fasting') {
      phaseHtml=`
        <div class="phase-row"><div class="phase-dot fasting"></div><span class="phase-text fasting">FASTING</span></div>
        <div class="timer ${ready?'ready':''}">${ready?'✦ READY TO SEAL':fmtMs(rem)}</div>
        <div class="prog-bar"><div class="prog-fill" style="width:${Math.round(prog*100)}%"></div></div>`;
      const sealClass = ready ? 'ready' : 'locked';
      const sealLabel = ready ? '◆ SEAL CYCLE' : '⚡ FORCE SEAL';
      const sealTitle = ready ? 'Seal this completed cycle' : 'Phase not complete — sealing early causes structural damage';
      actionsHtml=`<button class="btn btn-seal ${sealClass}" title="${sealTitle}" onclick="sealCycle('${o.id}')">${sealLabel}</button>
                   <button class="btn btn-void" title="Void — records a crack" onclick="voidCycle('${o.id}')">⚑ VOID</button>`;

    } else if (os.phase==='recovery') {
      const rr=getRemaining(o.id);
      phaseHtml=`
        <div class="phase-row"><div class="phase-dot recovery"></div><span class="phase-text recovery">RECOVERY</span></div>
        <div class="timer" style="color:#4cd98a;font-size:17px">${fmtMs(rr)}</div>
        <div class="prog-bar"><div class="prog-fill" style="width:${Math.round((1-prog)*100)}%;background:var(--green)"></div></div>`;
      actionsHtml=`<button class="btn btn-recovery" onclick="endRecovery('${o.id}')">◎ END RECOVERY</button>`;

    } else {
      phaseHtml=`
        <div class="phase-row"><div class="phase-dot"></div><span class="phase-text">IDLE</span></div>
        <div class="timer idle">${o.dur}:00:00</div>
        <div class="prog-bar"><div class="prog-fill" style="width:0%"></div></div>`;
      actionsHtml=`<button class="btn btn-start" onclick="startFasting('${o.id}')">▶ BEGIN FAST</button>`;
    }

    const card=document.createElement('div');
    card.className=`order-card is-${os.phase}`;
    card.style.setProperty('--oc',o.color);
    card.innerHTML=`
      <div class="oc-label">${o.district}</div>
      <div class="oc-duration">${o.label}</div>
      <div class="rank-block">
        <div class="rank-name">${rank.sym} ${rank.name}</div>
        <div class="rank-cycles">${os.cycles} cycle${os.cycles!==1?'s':''} sealed</div>
      </div>
      ${phaseHtml}
      <div class="stats-row">
        <div class="stat"><div class="stat-val">${os.cycles}</div><div class="stat-lbl">Cycles</div></div>
        <div class="stat cracks"><div class="stat-val">${os.cracks}</div><div class="stat-lbl">Cracks</div></div>
        <div class="stat"><div class="stat-val">${rank.tier}</div><div class="stat-lbl">Tier</div></div>
      </div>
      <div class="mastery-badge${mas>0?' visible':''}">⬆ Mastery Bonus: +${mas}%</div>
      <div class="actions">${actionsHtml}</div>`;
    grid.appendChild(card);
  });
}

function renderChronicle() {
  const log=document.getElementById('chronLog'), cnt=document.getElementById('chronCount');
  cnt.textContent=`${state.chronicle.length} entr${state.chronicle.length!==1?'ies':'y'}`;
  if (!state.chronicle.length) {
    log.innerHTML='<div class="chron-empty">The chronicle awaits your first cycle…</div>'; return;
  }
  log.innerHTML=state.chronicle.map(e=>`
    <div class="chron-entry">
      <div class="chron-icon" style="color:${e.color}">${e.icon}</div>
      <div class="chron-body">
        <div class="chron-title" style="color:${e.color}">${e.title}</div>
        <div class="chron-text">${e.text}</div>
        <div class="chron-time">${e.ts}</div>
      </div>
    </div>`).join('');
}

function buildDistrictLabels() {
  document.getElementById('districtLabels').innerHTML =
    ORDERS.map(o=>`<div class="district-label" id="dlbl-${o.id}">${o.district}</div>`).join('');
}

function fullRender() { renderIdentity(); renderStability(); renderCards(); renderChronicle(); }

/* ============================================================
   ANIMATION LOOP & TIMER
============================================================ */
function animate() { drawCity(); requestAnimationFrame(animate); }

setInterval(() => {
  let changed=false;
  ORDERS.forEach(o => {
    const os=state.orders[o.id];
    if (os.phase==='recovery' && os.phaseEnd && Date.now()>=os.phaseEnd) { endRecovery(o.id); changed=true; }
  });
  if (!changed) { renderCards(); renderIdentity(); renderStability(); }
}, 1000);

/* ============================================================
   INIT
============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  initState(); resizeCanvas(); genStars(); buildDistrictLabels(); fullRender();
  requestAnimationFrame(animate);
});
window.addEventListener('resize', () => { resizeCanvas(); genStars(); });

// Expose for inline handlers
window.startFasting = startFasting;
window.sealCycle    = sealCycle;
window.voidCycle    = voidCycle;
window.endRecovery  = endRecovery;
</script>
</body>
</html>
