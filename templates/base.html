<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Architects' Codex</title>
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #161b27;
      --surface2: #1e2536;
      --accent: #e8b84b;
      --accent2: #5bc4a8;
      --danger: #e05c5c;
      --success: #5bc45b;
      --text: #d4d8e2;
      --muted: #7a8099;
      --border: #2a3048;
      --radius: 8px;
      --font-mono: "Courier New", Courier, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Nav ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 56px;
    }
    nav .brand {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--accent);
      letter-spacing: .04em;
    }
    nav a {
      color: var(--muted);
      font-size: .9rem;
    }
    nav a:hover, nav a.active { color: var(--text); }

    /* ── Layout ── */
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
    }
    .card h2 {
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* ── Stats row ── */
    .stats { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .75rem 1.25rem;
      flex: 1 1 140px;
    }
    .stat .label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .stat .value { font-size: 1.6rem; font-weight: 700; color: var(--accent); margin-top: .2rem; }
    .stat .value.ok { color: var(--success); }
    .stat .value.bad { color: var(--danger); }

    /* ── Progress bar ── */
    .progress-wrap { margin: .4rem 0 .1rem; }
    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar span {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width .3s;
    }
    .progress-label { font-size: .7rem; color: var(--muted); margin-top: .3rem; }

    /* ── City map ── */
    .city-map {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      font-family: var(--font-mono);
      font-size: .78rem;
      line-height: 1.6;
      white-space: pre;
      overflow-x: auto;
      color: var(--text);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .5rem 1.1rem;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-size: .85rem;
      font-weight: 600;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #0d0f14; }
    .btn-success { background: var(--success); color: #0d0f14; }
    .btn-danger  { background: var(--danger);  color: #fff; }
    .btn-muted   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: .3rem .7rem; font-size: .78rem; }

    /* ── Forms ── */
    select, input[type="text"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: .45rem .75rem;
      font-size: .85rem;
      width: 100%;
      margin-bottom: .75rem;
    }
    select:focus, input[type="text"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }
    label { font-size: .78rem; color: var(--muted); display: block; margin-bottom: .3rem; }
    .form-row { display: flex; gap: .75rem; align-items: flex-end; }
    .form-row .grow { flex: 1; }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: .15rem .55rem;
      border-radius: 99px;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .badge-success { background: #1a3d1a; color: var(--success); }
    .badge-danger  { background: #3d1a1a; color: var(--danger); }
    .badge-warn    { background: #3d2e1a; color: var(--accent); }
    .badge-info    { background: #1a2e3d; color: var(--accent2); }

    /* ── Crack list ── */
    .crack-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .6rem 0;
      border-bottom: 1px solid var(--border);
    }
    .crack-item:last-child { border-bottom: none; }

    /* ── Flow state banner ── */
    .flow-banner {
      background: linear-gradient(90deg, #2a1e00 0%, #1e2536 100%);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: .7rem 1.2rem;
      margin-bottom: 1.5rem;
      font-size: .88rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: .6rem;
    }

    /* ── Active cycle card ── */
    .active-cycle-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
    .cycle-elapsed { font-size: .78rem; color: var(--muted); }

    /* ── Section heading ── */
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1rem;
    }
    .hint { font-size: .75rem; color: var(--muted); margin-top: .5rem; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<nav>
  <span class="brand">⚙ The Architects' Codex</span>
  <a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
  <a href="{{ url_for('orders') }}" {% if request.endpoint == 'orders' %}class="active"{% endif %}>Orders</a>
  <a href="{{ url_for('history') }}" {% if request.endpoint == 'history' %}class="active"{% endif %}>History</a>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
